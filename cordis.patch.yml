# Install this layer with:
# dsh plugin --profile web add dsh-workspace
- insert:
    - id: dsh-workspace
      name: dsh-workspace
      inject: [sessionController, workspaceController, settingsController, credentialsController, llm, agentPresets, webServer, agents, commands]
      config:
        dataDir: !!js dshHomePath('dsh-workspace')
        remoteHost: 0.0.0.0
        port: 3090
        maxUploadBytes: 20971520
